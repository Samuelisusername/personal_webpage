<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Gair - Machine Learning & Software Engineer</title>
    <style>
        /* Modern Dark Theme for ML/SWE */
        :root {
            --bg: #0d1117;
            --text: #c9d1d9;
            --accent: #58a6ff;
            --secondary: #8b949e;
            --card-bg: #161b22;
            --border: #30363d;
            --tag-bg: #1f6feb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 50px 20px;
        }
        header {
            text-align: left;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 30px;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 5px;
            font-size: 2.5em;
        }
        .subtitle {
            color: var(--accent);
            font-size: 1.2em;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .links a {
            display: inline-block;
            margin-right: 15px;
            color: #ffffff;
            text-decoration: none;
            background: var(--border);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.9em;
            transition: background 0.2s;
        }
        .links a:hover {
            background: var(--accent);
        }
        .quote {
            font-style: italic;
            color: var(--secondary);
            margin-top: 25px;
            padding: 15px;
            border-left: 4px solid var(--accent);
            background: var(--card-bg);
            border-radius: 0 4px 4px 0;
        }
        h2 {
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-top: 40px;
            font-size: 1.5em;
        }
        .item {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .coursework {
            background: transparent;
            padding: 0 5px;
            border: none;
            margin-bottom: 30px;
        }
        .item h3 {
            margin: 0 0 5px 0;
            color: #ffffff;
            font-size: 1.2em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item h3 a {
            color: var(--accent);
            font-size: 0.8em;
            text-decoration: none;
            font-weight: normal;
        }
        .item h3 a:hover {
            text-decoration: underline;
        }
        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--secondary);
            font-size: 0.9em;
            margin-bottom: 15px;
        }
        ul {
            margin: 0;
            padding-left: 20px;
        }
        li {
            margin-bottom: 8px;
        }
        .media-preview {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 4px;
            margin-top: 15px;
            border: 1px solid var(--border);
            display: block;
        }
        .banner-preview {
            width: 100%;
            height: auto;
            border-radius: 4px;
            margin-top: 15px;
            border: 1px solid var(--border);
            display: block;
            object-fit: contain;
        }
        .image-gallery {
            display: grid;
            grid-template-columns: 2fr 3fr; 
            gap: 15px;
            margin-top: 15px;
            align-items: center; 
        }
        .image-gallery img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        .publication-cite {
            font-size: 0.9em;
            color: var(--secondary);
            margin-top: 4px;
            display: block;
            border-left: 2px solid var(--border);
            padding-left: 10px;
        }
        .publication-cite strong {
            color: #ffffff;
        }
        .publication-cite a {
            color: var(--accent);
            text-decoration: none;
        }
        .publication-cite a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            .image-gallery {
                grid-template-columns: 1fr; 
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>Samuel Gair</h1>
            <p class="subtitle">ETH Computer Science MSc | Machine Intelligence & Data Systems</
